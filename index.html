<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>EduCenter — نظام إدارة الطلاب</title>

  <link rel="stylesheet" href="assets/style.css?v=2">
</head>

<body>

  <!-- Login -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">

      <div class="logo">E</div>

      <h1>EduCenter</h1>
      <p>تسجيل الدخول إلى حسابك</p>

      <form id="loginForm">

        <label>
          البريد الإلكتروني أو ID الطالب
          <input
            id="loginId"
            required
            autocomplete="username"
          >
        </label>

        <label>
          كلمة المرور
          <input
            id="loginPassword"
            type="password"
            required
            autocomplete="current-password"
          >
        </label>

        <button class="btn full" type="submit">
          تسجيل الدخول
        </button>

        <div id="loginMsg" class="error"></div>

      </form>
    </div>
  </div>


  <!-- Application -->
  <div id="app" class="hidden">

    <aside class="sidebar">

      <div class="brand">
        <div class="logo">E</div>

        <div>
          <b>EduCenter</b>
          <small>نظام إدارة الطلاب</small>
        </div>
      </div>

      <nav id="nav"></nav>

      <div class="sidebar-foot">
        الحساب:
        <b id="roleLabel">—</b>

        <br>

        <button id="logout" class="link-btn">
          تسجيل الخروج
        </button>
      </div>

    </aside>


    <main class="main">

      <header class="topbar">

        <div>
          <h1 id="pageTitle">لوحة التحكم</h1>
          <p id="pageSub"></p>
        </div>

        <div class="userbox">

          <span class="avatar" id="avatar">م</span>

          <div>
            <b id="userName">—</b>
            <small id="userMeta">—</small>
          </div>

        </div>

      </header>


      <section id="content"></section>

    </main>

  </div>


  <!-- Modal -->
  <div id="modal" class="modal hidden">

    <div class="modal-card">

      <button class="close" onclick="closeModal()">
        ×
      </button>

      <div id="modalContent"></div>

    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Project configuration -->
  <script src="assets/config.js?v=2"></script>

  <!-- Application -->
  <script src="assets/app.js?v=2"></script>

</body>
</html>
