<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduCenter — نظام إدارة الطلاب</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">E</div><div><b>EduCenter</b><small>نظام إدارة الطلاب</small></div></div>
    <nav id="nav">
      <button class="active" data-page="dashboard">الرئيسية</button>
      <button data-page="students">الطلاب</button>
      <button data-page="teachers">المعلمين</button>
      <button data-page="groups">المجموعات</button>
      <button data-page="attendance">الحضور</button>
      <button data-page="exams">الامتحانات</button>
      <button data-page="messages">المحادثات</button>
      <button data-page="notifications">الإشعارات</button>
      <button data-page="reports">التقارير</button>
      <button data-page="settings">الإعدادات</button>
    </nav>
    <div class="sidebar-foot">نسخة تجريبية محلية<br><span>اربط قاعدة بيانات قبل الاستخدام الفعلي</span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 id="pageTitle">لوحة التحكم</h1><p id="pageSub">نظرة سريعة على النظام</p></div>
      <div class="userbox"><span class="avatar">م</span><div><b>المدير</b><small>Admin</small></div><button id="logout" class="ghost">خروج</button></div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script src="assets/app.js"></script>
</body>
</html>
